<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaveAll — Video Downloader</title>
<style>
  :root {
    --bg: #0d0f14; --card: #161a22; --line: #262c38; --text: #e8ebf1; --muted: #8a93a6;
    --accent: #6c8cff; --accent-2: #8f6cff; --ok: #3ecf8e; --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: radial-gradient(1200px 600px at 50% -200px, #1d2340 0%, var(--bg) 60%); color: var(--text);
    display: flex; justify-content: center; padding: 64px 16px;
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 40px; margin: 0 0 6px; letter-spacing: -0.02em; text-align: center; }
  h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; color: transparent; }
  .sub { color: var(--muted); text-align: center; margin: 0 0 32px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .row { display: flex; gap: 10px; }
  input[type=url] {
    flex: 1; min-width: 0; background: #0f1218; border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 14px 16px; font-size: 15px; outline: none;
  }
  input[type=url]:focus { border-color: var(--accent); }
  button {
    border: 0; border-radius: 10px; padding: 0 20px; font-size: 15px; font-weight: 600; cursor: pointer;
    color: white; background: linear-gradient(90deg, var(--accent), var(--accent-2));
  }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: #222836; color: var(--text); }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: #222836; color: var(--accent); margin-top: 12px; }
  .hidden { display: none !important; }
  .preview { display: flex; gap: 14px; margin-top: 18px; }
  .preview img { width: 160px; height: 90px; object-fit: cover; border-radius: 10px; background: #0f1218; flex-shrink: 0; }
  .preview .t { font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .preview .m { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 8px; }
  .seg { display: flex; background: #0f1218; border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
  .seg button { flex: 1; background: transparent; color: var(--muted); padding: 10px; font-weight: 600; }
  .seg button.on { background: #222836; color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { background: #0f1218; border: 1px solid var(--line); color: var(--muted); padding: 8px 14px; font-weight: 500; }
  .chips button.on { border-color: var(--accent); color: var(--text); background: #1a2035; }
  .go { width: 100%; padding: 15px; margin-top: 22px; font-size: 16px; }
  .bar { height: 8px; background: #0f1218; border-radius: 99px; overflow: hidden; margin-top: 18px; }
  .bar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s; }
  .bar.indeterminate div { width: 30% !important; animation: slide 1.2s infinite ease-in-out; }
  @keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
  .status { color: var(--muted); font-size: 14px; margin-top: 10px; min-height: 20px; }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff6; border-top-color: #fff; border-radius: 50%; animation: r .7s linear infinite; vertical-align: -2px; }
  @keyframes r { to { transform: rotate(360deg); } }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>Save<span>All</span></h1>
  <p class="sub">Paste a link from YouTube, TikTok, Instagram, X, Reddit, Facebook & more.</p>

  <div class="card">
    <form class="row" id="form">
      <input type="url" id="url" placeholder="https://…" autocomplete="off" required autofocus>
      <button type="submit" id="fetchBtn">Fetch</button>
    </form>
    <span class="badge hidden" id="platform"></span>
    <div class="status" id="fetchStatus"></div>

    <div id="options" class="hidden">
      <div class="preview">
        <img id="thumb" alt="">
        <div><div class="t" id="title"></div><div class="m" id="meta"></div></div>
      </div>

      <div class="label">Type</div>
      <div class="seg" id="kind">
        <button type="button" data-v="video" class="on">🎬 Video</button>
        <button type="button" data-v="audio">🎵 Audio</button>
      </div>

      <div class="label">Format</div>
      <div class="chips" id="format"></div>

      <div id="qualityWrap">
        <div class="label">Quality</div>
        <div class="chips" id="quality"></div>
      </div>

      <button class="go" id="dlBtn">Download</button>
      <div class="bar hidden" id="bar"><div></div></div>
      <div class="status" id="dlStatus"></div>
    </div>
  </div>
  <footer>Only download content you own or have permission to save.</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const FORMATS = { video: ["mp4", "webm", "mkv"], audio: ["mp3", "m4a", "wav", "opus"] };
const DOMAINS = {
  "youtube.com": "YouTube", "youtu.be": "YouTube", "tiktok.com": "TikTok", "instagram.com": "Instagram",
  "facebook.com": "Facebook", "fb.watch": "Facebook", "twitter.com": "X / Twitter", "x.com": "X / Twitter",
  "reddit.com": "Reddit", "vimeo.com": "Vimeo", "twitch.tv": "Twitch", "soundcloud.com": "SoundCloud",
  "pinterest.com": "Pinterest", "threads.net": "Threads", "dailymotion.com": "Dailymotion",
};
const state = { url: "", kind: "video", format: "mp4", quality: "best", heights: [] };

function guessPlatform(url) {
  try {
    const host = new URL(/^https?:\/\//.test(url) ? url : "https://" + url).hostname.replace(/^(www|m)\./, "");
    return Object.entries(DOMAINS).find(([d]) => host === d || host.endsWith("." + d))?.[1];
  } catch { return null; }
}

function setStatus(el, text, cls = "") { el.className = "status " + cls; el.innerHTML = text; }

function chips(container, values, current, labelFn, onPick) {
  container.innerHTML = "";
  for (const v of values) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = labelFn(v); b.className = v === current ? "on" : "";
    b.onclick = () => { onPick(v); [...container.children].forEach(c => c.classList.remove("on")); b.classList.add("on"); };
    container.appendChild(b);
  }
}

function render() {
  chips($("format"), FORMATS[state.kind], state.format, v => v.toUpperCase(), v => state.format = v);
  $("qualityWrap").classList.toggle("hidden", state.kind === "audio" || !state.heights.length);
  chips($("quality"), ["best", ...state.heights.map(String)], state.quality,
    v => v === "best" ? "Best" : v + "p", v => state.quality = v);
}

// Live platform badge while typing/pasting
$("url").addEventListener("input", () => {
  const p = guessPlatform($("url").value.trim());
  $("platform").textContent = p || "";
  $("platform").classList.toggle("hidden", !p);
});
// Auto-fetch on paste
$("url").addEventListener("paste", () => setTimeout(() => $("form").requestSubmit(), 0));

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const url = $("url").value.trim();
  if (!url) return;
  $("options").classList.add("hidden");
  $("fetchBtn").disabled = true;
  setStatus($("fetchStatus"), '<span class="spin"></span> Looking up video…');
  try {
    const r = await fetch("/api/info", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    Object.assign(state, { url, heights: d.heights, quality: "best" });
    $("platform").textContent = d.platform; $("platform").classList.remove("hidden");
    $("thumb").src = d.thumbnail || ""; $("thumb").classList.toggle("hidden", !d.thumbnail);
    $("title").textContent = d.title;
    const dur = d.duration ? new Date(d.duration * 1000).toISOString().substr(d.duration >= 3600 ? 11 : 14, d.duration >= 3600 ? 8 : 5) : "";
    $("meta").textContent = [d.uploader, dur].filter(Boolean).join(" · ");
    setStatus($("fetchStatus"), "");
    setStatus($("dlStatus"), "");
    $("bar").classList.add("hidden");
    render();
    $("options").classList.remove("hidden");
  } catch (err) {
    setStatus($("fetchStatus"), err.message || "Couldn't read that link.", "err");
  } finally {
    $("fetchBtn").disabled = false;
  }
});

$("kind").addEventListener("click", e => {
  const v = e.target.dataset.v; if (!v) return;
  state.kind = v; state.format = FORMATS[v][0];
  [...$("kind").children].forEach(b => b.classList.toggle("on", b.dataset.v === v));
  render();
});


const fmtBytes = b => b > 1e6 ? (b / 1e6).toFixed(1) + " MB/s" : (b / 1e3).toFixed(0) + " KB/s";

$("dlBtn").addEventListener("click", async () => {
  $("dlBtn").disabled = true;
  const bar = $("bar"), fill = bar.firstElementChild;
  bar.classList.remove("hidden"); bar.classList.add("indeterminate"); fill.style.width = "0";
  setStatus($("dlStatus"), "Starting…");
  try {
    const r = await fetch("/api/download", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: state.url, kind: state.kind, format: state.format, quality: state.quality }),
    });
    const { id, error } = await r.json();
    if (!r.ok) throw new Error(error);

    while (true) {
      await new Promise(res => setTimeout(res, 700));
      const p = await (await fetch("/api/progress/" + id)).json();
      if (p.status === "downloading") {
        bar.classList.toggle("indeterminate", !p.percent);
        fill.style.width = p.percent + "%";
        setStatus($("dlStatus"), `Downloading… ${p.percent}%` + (p.speed ? ` · ${fmtBytes(p.speed)}` : "") + (p.eta ? ` · ${p.eta}s left` : ""));
      } else if (p.status === "processing") {
        bar.classList.add("indeterminate");
        setStatus($("dlStatus"), "Processing (merging / converting)…");
      } else if (p.status === "done") {
        bar.classList.remove("indeterminate"); fill.style.width = "100%";
        setStatus($("dlStatus"), "✓ Saved: " + p.file, "ok");
        const a = document.createElement("a");
        a.href = "/api/file/" + id; a.download = p.file; document.body.appendChild(a); a.click(); a.remove();
        break;
      } else if (p.status === "error") {
        throw new Error(p.error);
      }
    }
  } catch (err) {
    bar.classList.add("hidden");
    setStatus($("dlStatus"), err.message || "Download failed.", "err");
  } finally {
    $("dlBtn").disabled = false;
  }
});
</script>
</body>
</html>
